name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Generate Dummy Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android,O=Android,C=US"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Mod-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
          
