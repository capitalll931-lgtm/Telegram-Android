name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Generate Dummy Keystore
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/release.keystore
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android,O=Android,C=US"
          echo "RELEASE_STORE_PASSWORD=password" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=alias_name" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=password" >> gradle.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Mod-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
          
